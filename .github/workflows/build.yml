name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  AMVI_VERSION: v0.13.4
  LIVEDIAG_REPO: https://github.com/Nemo-010/livediag
  LIVEDIAG_REF: main

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # BIOS + extlinux boots in seconds and is what the QEMU harness
          # uses.  Real laptops are UEFI, so that image is shipped too.
          - { arch: x86_64, bootmode: BIOS, name: x86_64 }
          - { arch: x86_64, bootmode: UEFI, name: x86_64-uefi }
          - { arch: aarch64, bootmode: UEFI, name: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-utils e2fsprogs dosfstools fdisk util-linux rsync

      - name: Enable aarch64 emulation
        if: matrix.arch == 'aarch64'
        uses: jirutka/setup-alpine@v1
        with:
          arch: aarch64

      - name: Fetch alpine-make-vm-image
        run: |
          curl -fsSLo alpine-make-vm-image \
            "https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/${AMVI_VERSION}/alpine-make-vm-image"
          chmod +x alpine-make-vm-image

      - name: Assemble the package list
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          filter() { grep -vE '^[[:space:]]*(#|$)' "$1" || true; }
          {
            filter packages
            if [ -f "packages.$ARCH" ]; then filter "packages.$ARCH"; fi
          } | tr '\n' ' ' > packages.txt
          printf 'packages: %s\n' "$(cat packages.txt)"

      - name: Build the image
        env:
          ARCH: ${{ matrix.arch }}
          BOOTMODE: ${{ matrix.bootmode }}
          NAME: ${{ matrix.name }}
        run: |
          image="livediag-alpine-${NAME}.qcow2"
          sudo ./alpine-make-vm-image \
            --arch "${ARCH}" \
            --kernel-flavor lts \
            --boot-mode "${BOOTMODE}" \
            --image-format qcow2 \
            --image-size 5G \
            --serial-console \
            --repositories-file repositories \
            --packages "$(cat packages.txt)" \
            --fs-skel-dir overlay \
            --fs-skel-chown root:root \
            --script-chroot \
            "${image}" -- ./configure.sh "${LIVEDIAG_REPO}" "${LIVEDIAG_REF}"
          sudo chown "$(id -u):$(id -g)" "${image}"

      - name: Compress and checksum
        env:
          NAME: ${{ matrix.name }}
        run: |
          image="livediag-alpine-${NAME}.qcow2"
          qemu-img convert -O qcow2 -c "${image}" "${image}.compressed"
          mv "${image}.compressed" "${image}"
          qemu-img convert -O raw "${image}" "livediag-alpine-${NAME}.img"
          gzip -9 "livediag-alpine-${NAME}.img"
          sha256sum "${image}" "livediag-alpine-${NAME}.img.gz" \
            > "livediag-alpine-${NAME}.sha256"
          ls -lh livediag-alpine-"${NAME}".*

      - uses: actions/upload-artifact@v4
        with:
          name: livediag-alpine-${{ matrix.name }}
          path: |
            livediag-alpine-${{ matrix.name }}.qcow2
            livediag-alpine-${{ matrix.name }}.img.gz
            livediag-alpine-${{ matrix.name }}.sha256
          if-no-files-found: error

  release:
    name: release
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
